[package]
name = "tw-appmanager"
version = "0.1.0"
edition = "2024"
description = "Linux library and launcher for AppImages, native programs, and web apps"

[dependencies]
anyhow = "1"
backhand = "0.25"
clap = { version = "4.6", features = ["derive"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tempfile = "3"
toml = "1"
url = "2"

[profile.dev]
debug = 0
