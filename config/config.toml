# Included files are applied in order after this file. Relative paths are resolved
# from the file that includes them. Optional includes can be created at any time.
[include.optional]
files = ["noctalia.toml"]

[ui]
view = "list"
sidebar_collapsed = false

[appearance]
use_included_colors = true

[appearance.colors]
background = "#252525"
sidebar = "#202020"
surface = "#2c2c2c"
text_primary = "#f3f1f0"
text_muted = "#c4c2c0"
accent_primary = "#f3f1f0"
accent_secondary = "#8dc1ff"
accent_tertiary = "#e8b45e"
accent_text = "#252525"
error = "#ffb3ac"
error_text = "#37130f"

[appearance.colors.border]
focused = "#69a1e8"
unfocused = "#555555"
outer = "#555555"

[appearance.typography]
font_family = "" # Use the system font when empty.
font_size = 14.0
heading_size = 26.0

[appearance.layout]
sidebar_width = 182.0
page_padding = 24.0
content_width = 820.0
spacing = 8.0
icon_size = 40.0

[appearance.borders]
width = 1.0
window_width = 0.0 # Optional border inside the app window.
radius = 4.0
card_radius = 6.0
shadows = false

[apps]
icons_directory = "" # Empty uses the app's XDG data directory.

[apps.image]
move_directory = "~/Applications"
move_to_directory = false

[apps.web]
browser_path = "/usr/bin/helium"

[apps.executable]
working_directory = "" # Empty starts programs from their own folder.
